apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: ml-platform
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1   
      maxSurge: 0
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: fraud-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: REPLACE_ECR_URI          # replaced by scripts/demo-up.ps1
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_BUCKET
              value: REPLACE_MODEL_BUCKET
            - name: MODEL_VERSION
              value: latest
            - name: MODEL_DIR
              value: /tmp/model
            - name: AWS_REGION
              value: ap-south-1
            - name: AWS_DEFAULT_REGION
              value: ap-south-1
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: ml-platform
spec:
  type: LoadBalancer
  selector:
    app: fraud-api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-api
  namespace: ml-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-api
  minReplicas: 1
  maxReplicas: 2        
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
